services:
  collector:
    build:
      context: .
    volumes:
      - ./data:/app/data
    command:
      - --output
      - /app/data/events.ndjson
      - --interval-ms
      - "1000"
      - --alert-percentage
      - "3"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      interval: 2s
      timeout: 5s
      retries: 15

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME:?Set MONGO_USERNAME in .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}"
      MONGO_DATABASE: "${MONGO_DATABASE:?Set MONGO_DATABASE in .env}"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 2s
      timeout: 5s
      retries: 15

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    profiles:
      - ingestion
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      ENTPOINT_INPUT_PATH: /app/data/events.ndjson
      ENTPOINT_POSTGRES: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      ENTPOINT_MONGO: "mongodb://${MONGO_USERNAME:?Set MONGO_USERNAME in .env}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/?authSource=admin"
      ENTPOINT_MONGO_DATABASE: "${MONGO_DATABASE:?Set MONGO_DATABASE in .env}"
    volumes:
      - ./data:/app/data:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ENTPOINT_POSTGRES: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      ENTPOINT_MONGO: "mongodb://${MONGO_USERNAME:?Set MONGO_USERNAME in .env}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/?authSource=admin"
      ENTPOINT_MONGO_DATABASE: "${MONGO_DATABASE:?Set MONGO_DATABASE in .env}"
    ports:
      - "8080:8080"

  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles:
      - test
    working_dir: /workspace
    volumes:
      - .:/workspace
    command:
      - dotnet
      - test
      - EntPoint.slnx
      - --configuration
      - Release

volumes:
  postgres_data:
  mongo_data:
