<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EntPoint API Demo</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main>
		<h1>EntPoint API Demo</h1>
		<p>Query the simulated endpoint data stored in PostgreSQL and MongoDB.</p>

		<section class="controls">
			<label for="endpoint">Endpoint</label>
			<select id="endpoint"></select>

			<label for="minimum-score">Minimum alert score</label>
			<input id="minimum-score" type="number" min="1" max="100" value="70">

			<div class="buttons">
				<button id="summary">Load Endpoint Summary</button>
				<button id="recent-alerts">Load 10 Recent Alerts</button>
				<button id="filtered-alerts">Filter Alerts</button>
			</div>
		</section>

		<p id="status" role="status">Loading endpoints...</p>
		<pre id="output"></pre>
	</main>
	<script src="app.js"></script>
</body>
</html>
